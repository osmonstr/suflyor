<!doctype html><html lang="ru"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Суфлёр ОЖЛ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="css">
/* Layout: calm full-screen reading surface, one glass reading line, a glass dock with one primary action. Only transform changes while text moves. */
:root,[data-skin="night"]{--bg:#0E0F12;--ink:#F4F4F6;--tint:#64A0FF;--scheme:dark;
  --glass-a:rgba(255,255,255,.14);--glass-b:rgba(255,255,255,.06);--glass-solid:rgba(38,40,46,.92);--glass-ink:#fff;--glass-dim:rgba(255,255,255,.62);--glass-fill:rgba(255,255,255,.1);--edge-hi:rgba(255,255,255,.28);--edge-lo:rgba(0,0,0,.28);--shadow:rgba(0,0,0,.45);
  --s-bg:#1C1C1E;--s-cell:#2C2C2E;--s-fg:#fff;--s-dim:rgba(235,235,245,.6);--s-sep:rgba(84,84,88,.6);--s-fill:rgba(120,120,128,.32);--s-seg:#636366;--tint-ink:#06121f;
  color-scheme:dark}
[data-skin="graphite"]{--bg:#1F2126;--ink:#ECEEF1;--tint:#7FB2FF}
[data-skin="navy"]{--bg:#14213A;--ink:#EEF2FA;--tint:#8FBBFF}
[data-skin="pine"]{--bg:#15291F;--ink:#EDF3EC;--tint:#8FCCA3;--tint-ink:#0a1a10}
[data-skin="plum"]{--bg:#241B2E;--ink:#F2EEF6;--tint:#BFA3E6;--tint-ink:#190f25}
[data-skin="sepia"]{--bg:#2A231B;--ink:#F2E9DA;--tint:#D9B27C;--tint-ink:#21170a}
[data-skin="paper"],[data-skin="white"],[data-skin="mist"],[data-skin="sage"]{
  --glass-a:rgba(255,255,255,.72);--glass-b:rgba(255,255,255,.46);--glass-solid:rgba(250,250,252,.94);--glass-ink:#111;--glass-dim:rgba(20,20,25,.58);--glass-fill:rgba(20,20,25,.07);--edge-hi:rgba(255,255,255,.9);--edge-lo:rgba(0,0,0,.08);--shadow:rgba(30,30,40,.2);
  --s-bg:#F2F2F7;--s-cell:#fff;--s-fg:#000;--s-dim:rgba(60,60,67,.6);--s-sep:rgba(60,60,67,.2);--s-fill:rgba(120,120,128,.14);--s-seg:#fff;--tint-ink:#fff;color-scheme:light}
[data-skin="paper"]{--bg:#F5F2EA;--ink:#23201A;--tint:#8A6A3B}
[data-skin="white"]{--bg:#FFFFFF;--ink:#15171A;--tint:#0A6CFF}
[data-skin="mist"]{--bg:#E8EDF2;--ink:#1A2430;--tint:#2F6FB5}
[data-skin="sage"]{--bg:#E6ECE3;--ink:#1E2A20;--tint:#3F7A55}

:root{--ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Roboto,'Segoe UI',system-ui,sans-serif;--read:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Roboto,'Segoe UI',system-ui,sans-serif;--rw:600;
  --ry:33%;--pad-l:24px;--pad-r:24px;--spring:cubic-bezier(.32,.72,0,1);--stage-l:0px;--dim-a:.76;--dim-b:.5}
:root[data-ui="camera"]{--ry:max(16%,88px)}
:root[data-ui="remote"]{--pad-r:96px}
:root[data-ui="desk"]{--pad-l:356px;--pad-r:44px;--stage-l:320px}
:root[data-guide="spot"]{--dim-a:.9;--dim-b:.78}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body.insheet{--ry:8%}
body.kbd{--ry:calc(64px + env(safe-area-inset-top,0px))}
:root[data-ui="desk"] body.insheet{--ry:33%}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

/* stage: text layer moves, everything above it stays still */
#stage{position:fixed;inset:0;z-index:1;overflow:hidden;cursor:pointer;touch-action:none;contain:strict}
.script{left:0;right:0;top:0;
  padding-left:max(var(--pad-l),env(safe-area-inset-left,0px));padding-right:max(var(--pad-r),env(safe-area-inset-right,0px));
  font-family:var(--read);font-size:var(--fs,52px);font-weight:var(--rw);letter-spacing:-.012em;white-space:pre-wrap;overflow-wrap:anywhere;
  line-height:var(--lh,1.35);--line:calc(var(--fs,52px)*var(--lh,1.35))}
#text{position:absolute;will-change:transform;color:var(--ink)}
#measure{position:fixed;visibility:hidden;pointer-events:none;z-index:-1}
.ln+.ln{margin-top:calc(var(--gl,0)*var(--line))}
.para+.para{margin-top:calc(var(--g,0)*var(--line))}
.para.far{visibility:hidden}
.para.flagged{outline:2px solid var(--tint);outline-offset:4px;border-radius:8px}
.fitting .w{white-space:nowrap}
.fitting{overflow-wrap:normal}
#shade{position:fixed;inset:0;z-index:2;pointer-events:none;
  --band:calc(var(--fs,52px)*var(--bandL,1.5));
  background:linear-gradient(to bottom,
    color-mix(in srgb,var(--bg) calc(var(--dim-a)*100%),transparent) 0,
    color-mix(in srgb,var(--bg) calc(var(--dim-a)*100%),transparent) calc(var(--ry) - 24px),
    transparent var(--ry),transparent calc(var(--ry) + var(--band)),
    color-mix(in srgb,var(--bg) calc(var(--dim-b)*100%),transparent) calc(var(--ry) + var(--band) + 44px),
    color-mix(in srgb,var(--bg) calc(var(--dim-b)*100%),transparent) 100%)}

/* reading line */
#guide{position:fixed;z-index:0;left:var(--stage-l);right:0;top:var(--ry);height:calc(var(--fs,52px)*var(--bandL,1.5));pointer-events:none;--b:2px;--ar:11px;--c:22px;--inset:10px;--r:18px;--lf:color-mix(in srgb,var(--ink) 12%,transparent);--ls:color-mix(in srgb,var(--ink) 45%,transparent)}
.guide-el{box-sizing:border-box}
.guide-el::before,.guide-el::after{content:none;position:absolute;top:50%;transform:translateY(-50%);border-block:calc(var(--ar)*.72) solid transparent}
[data-g="pill"]{left:calc(var(--stage-l) + var(--inset));right:var(--inset);background:var(--lf);border-radius:var(--r);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--ink) 16%,transparent)}
[data-g="band"]{background:var(--lf)}
[data-g="frame"]{border-block:var(--b) solid var(--ls)}
[data-g="under"]::after{content:"";left:var(--inset);right:var(--inset);bottom:0;top:auto;transform:none;border:0;height:var(--b);background:var(--ls);border-radius:9px}
[data-g="arrows"]::before{content:"";left:6px;border-left:var(--ar) solid var(--tint)}
[data-g="arrows"]::after{content:"";right:6px;border-right:var(--ar) solid var(--tint)}
[data-g="corners"]{background:
  linear-gradient(var(--ls),var(--ls)) left 8px top/var(--c) var(--b) no-repeat,linear-gradient(var(--ls),var(--ls)) left 8px top/var(--b) var(--c) no-repeat,
  linear-gradient(var(--ls),var(--ls)) right 8px top/var(--c) var(--b) no-repeat,linear-gradient(var(--ls),var(--ls)) right 8px top/var(--b) var(--c) no-repeat,
  linear-gradient(var(--ls),var(--ls)) left 8px bottom/var(--c) var(--b) no-repeat,linear-gradient(var(--ls),var(--ls)) left 8px bottom/var(--b) var(--c) no-repeat,
  linear-gradient(var(--ls),var(--ls)) right 8px bottom/var(--c) var(--b) no-repeat,linear-gradient(var(--ls),var(--ls)) right 8px bottom/var(--b) var(--c) no-repeat}

/* liquid glass: bright rim, soft depth; the blur is dropped while text scrolls so frames stay cheap */
.glass{background:linear-gradient(160deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);color:var(--glass-ink);
  box-shadow:inset 0 1px 0 var(--edge-hi),inset 0 -1px 0 var(--edge-lo),0 10px 34px var(--shadow)}
body.playing .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass-solid)}
#top,#bar,#voiceChip,#kbdBar,#hud{z-index:5}

button{font:600 17px/1.15 var(--ui);letter-spacing:-.02em;background:none;color:inherit;border:0;padding:0;cursor:pointer;touch-action:manipulation;transition:transform .2s var(--spring),opacity .2s}
button:active{transform:scale(.94)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
#src:focus-visible,#nameIn:focus-visible,#kbdIn:focus-visible{outline:0}

#voiceChip{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;padding:9px 16px;border-radius:999px;font-size:15px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#hud{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);padding:14px 22px;border-radius:22px;font-size:22px;font-weight:600;letter-spacing:-.02em;pointer-events:none;font-variant-numeric:tabular-nums;white-space:nowrap}
#countdown{position:fixed;inset:0;z-index:4;display:grid;place-items:center;font:700 min(40vw,220px)/1 var(--ui);color:var(--ink);pointer-events:none}

/* title */
#top{position:fixed;left:0;right:0;top:0;pointer-events:none;display:flex;justify-content:center;padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));transition:opacity .25s}
body.playing #top,body.insheet #top,body.kbd #top{opacity:0}
body.playing #top *,body.insheet #top *,body.kbd #top *{pointer-events:none!important}
#titleBtn{pointer-events:auto;display:flex;align-items:center;gap:4px;max-width:100%;height:44px;padding:0 10px 0 18px;border-radius:22px;font-size:16px;font-weight:600}
#titleTx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:20px!important;height:20px!important;opacity:.6;flex:none}

/* dock */
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));box-sizing:border-box;width:min(calc(100% - 20px),520px);border-radius:30px;padding:8px 10px 6px;display:flex;flex-direction:column;gap:2px;transition:opacity .25s}
body.insheet #bar,body.kbd #bar{display:none}
#tempoRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:0 2px}
#tempoCtl{display:flex;align-items:center;gap:6px}
#restart{justify-self:start}
#time{justify-self:end;font-size:13px;color:var(--glass-dim);font-variant-numeric:tabular-nums;padding-right:6px;white-space:nowrap}
#tempoV{min-width:72px;text-align:center;font-size:12px;color:var(--glass-dim);font-weight:500;line-height:1.05}
#tempoV b{display:block;color:var(--glass-ink);font-size:21px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mini{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--glass-fill)}
.mini svg.i{width:19px;height:19px}
.step{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--glass-fill)}
#actions{display:flex;align-items:center;justify-content:space-between;padding-top:2px}
.act{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border-radius:18px}
.act .lb{font-size:11px;font-weight:500;letter-spacing:-.01em}
.act[aria-pressed="true"]{color:var(--tint)}
#moreBtn{display:none}
#play{flex:none;width:64px;height:64px;margin:0 2px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 4px 14px var(--shadow)}
#play svg{width:28px;height:28px;fill:currentColor;grid-area:1/1}
#play .ic-pause{display:none}
body.playing #play .ic-pause{display:block}
body.playing #play .ic-play{display:none}

input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;width:100%;height:44px;background:transparent;margin:0;touch-action:pan-y;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--tint) var(--p,50%),var(--s-fill) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--s-fill)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--tint)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 1px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.26)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 8px rgba(0,0,0,.26)}

/* compact pill: while reading, and in the clean-screen and at-the-lens layouts */
body.compact #bar{width:max-content;max-width:calc(100% - 16px);flex-direction:row;align-items:center;gap:4px;padding:6px;border-radius:34px}
body.compact :is(#tempoRow,#tempoCtl,#actions){display:contents}
body.compact :is(#time,#restart,#editBtn,#pauseBtn,#viewBtn,.lb){display:none}
body.compact #play{order:1;width:50px;height:50px;margin:0 4px 0 0}
body.compact #play svg{width:22px;height:22px}
body.compact #slower{order:2}
body.compact #tempoV{order:3;min-width:50px;font-size:10px}
body.compact #tempoV b{font-size:18px}
body.compact #faster{order:4}
body.compact #voiceBtn{order:5;flex:none;width:46px;min-height:46px}
body.compact #moreBtn{display:flex;order:6;flex:none;width:44px;min-height:46px}
body.compact.playing #moreBtn{display:none}
body.compact.playing #bar{opacity:.62}
:root[data-ui="camera"] body.compact #bar{bottom:auto;top:calc(8px + env(safe-area-inset-top,0px))}
:root[data-ui="camera"] body.compact.playing #bar{opacity:.3}
:root:is([data-ui="minimal"],[data-ui="camera"]) body.compact #top{display:none}
:root:is([data-ui="minimal"],[data-ui="camera"]) body.expanded #moreBtn{display:flex}

/* one-handed rail */
:root[data-ui="remote"] #top{right:82px}
:root[data-ui="remote"] #bar{left:auto;right:6px;transform:none;top:calc(6px + env(safe-area-inset-top,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));width:76px;border-radius:28px;padding:8px 6px;overflow-y:auto;scrollbar-width:none;justify-content:flex-end;gap:4px}
:root[data-ui="remote"] :is(#tempoRow,#tempoCtl,#actions){display:contents}
:root[data-ui="remote"] :is(#time,#moreBtn){display:none}
:root[data-ui="remote"] #bar button{flex:none}
:root[data-ui="remote"] #editBtn{order:1}
:root[data-ui="remote"] #pauseBtn{order:2}
:root[data-ui="remote"] #viewBtn{order:3;margin-bottom:auto}
:root[data-ui="remote"] #bar .act{width:100%;min-height:54px}
:root[data-ui="remote"] #bar .act .lb{font-size:10px}
:root[data-ui="remote"] #restart{order:4;align-self:center;width:44px;height:44px}
:root[data-ui="remote"] #voiceBtn{order:5}
:root[data-ui="remote"] #faster{order:6;align-self:center;width:50px;height:50px}
:root[data-ui="remote"] #tempoV{order:7;min-width:0;line-height:1;font-size:10px}
:root[data-ui="remote"] #slower{order:8;align-self:center;width:50px;height:50px}
:root[data-ui="remote"] #play{order:9;align-self:center;width:60px;height:60px;margin:6px 0 2px}
:root[data-ui="remote"] body.playing :is(#editBtn,#pauseBtn,#viewBtn){visibility:hidden}
:root[data-ui="remote"] body.insheet #bar{display:none}

/* laptop sidebar */
:root[data-ui="desk"] body::before{content:"";position:fixed;z-index:4;left:0;top:0;bottom:0;width:320px;background:color-mix(in srgb,var(--ink) 6%,var(--bg));box-shadow:inset -1px 0 0 color-mix(in srgb,var(--ink) 10%,transparent)}
:root[data-ui="desk"] #top{right:auto;width:320px;box-sizing:border-box;padding:16px}
:root[data-ui="desk"] #titleBtn{width:100%;justify-content:space-between}
:root[data-ui="desk"] #bar{left:12px;transform:none;bottom:12px;width:296px}
:root[data-ui="desk"] body.playing #top,:root[data-ui="desk"] body.insheet #top{opacity:1}
:root[data-ui="desk"] body.playing #top *{pointer-events:auto!important}
:root[data-ui="desk"] .sheet{left:0;right:auto;width:320px;max-height:100%;height:100%;margin:0;border-radius:0}
:root[data-ui="desk"] .grab{display:none}
:root[data-ui="desk"] #toast{left:calc(50% + 160px)}

/* sheets */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-height:64%;height:64%;display:flex;flex-direction:column;box-sizing:border-box;width:min(100%,600px);margin-inline:auto;background:var(--s-bg);color:var(--s-fg);border-radius:24px 24px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 30px rgba(0,0,0,.25);transition:height .36s var(--spring),max-height .36s var(--spring),transform .3s var(--spring);animation:rise .36s var(--spring)}
.sheet.full{max-height:92%;height:92%}
#micSheet,#tipsSheet,#textsSheet{height:auto;max-height:76%}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
.grab{flex:none;width:36px;height:5px;border-radius:3px;background:var(--s-dim);opacity:.45;margin:7px auto 0}
.sheet-head{flex:none;display:flex;align-items:center;gap:14px;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));font-size:20px;letter-spacing:-.03em;cursor:grab;touch-action:none}
.sheet-head b{margin-right:auto;font-weight:700}
.link{font-size:17px;font-weight:400;color:var(--tint);min-height:44px;padding:0 2px}
.link.strong{font-weight:600}
#spTotal{color:var(--s-dim);font-size:15px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:2px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;touch-action:pan-y}
.sheet-body h3{margin:12px 0 0;padding:0 4px;font-size:14px;font-weight:500;letter-spacing:-.01em;color:var(--s-dim)}
.hint{margin:4px 4px 6px;color:var(--s-dim);font-size:13px;line-height:1.35;letter-spacing:-.01em}
.primary{flex:none;min-height:50px;border-radius:14px;background:var(--tint);color:var(--tint-ink);font-weight:600}
.steps{margin:0 0 6px;padding:0 0 0 22px;font-size:16px;line-height:1.4;letter-spacing:-.02em;display:grid;gap:6px}

.group{background:var(--s-cell);border-radius:12px;overflow:hidden;flex:none}
.group.pad{padding:8px 16px}
.cell{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 16px;font-size:16px;font-weight:400;letter-spacing:-.02em;box-sizing:border-box;width:100%;text-align:left}
.cell+.cell{box-shadow:inset 0 .5px 0 var(--s-sep)}
.cell-btn{color:var(--tint)}
.tip{display:grid;gap:1px;justify-content:start}
.tip b{font-weight:500}.tip span{font-size:14px;color:var(--s-dim)}
.stepper{display:flex;align-items:center;background:var(--s-fill);border-radius:9px;height:34px;flex:none}
.stepper button{width:44px;height:34px;font-size:21px;font-weight:400;line-height:1}
.stepper output{min-width:30px;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.sw{-webkit-appearance:none;appearance:none;flex:none;width:51px;height:31px;margin:0;border-radius:16px;background:var(--s-fill);position:relative;cursor:pointer;transition:background-color .2s}
.sw::before{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:transform .25s var(--spring)}
.sw:checked{background:#34C759}
.sw:checked::before{transform:translateX(20px)}
.segmented{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:2px;margin:0 16px 10px;padding:2px;border-radius:9px;background:var(--s-fill)}
.segmented button{min-height:32px;border-radius:7px;font-size:14px;font-weight:500}
.segmented button[aria-selected="true"]{background:var(--s-seg);font-weight:600;box-shadow:0 2px 5px rgba(0,0,0,.14)}
.sp-label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:16px;letter-spacing:-.02em;padding-top:6px}
.sp-label output{color:var(--s-dim);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.capsules{display:flex;gap:8px;flex-wrap:wrap;flex:none}
.capsules.foot{margin-top:8px}
.capsule{flex:1 1 140px;display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--s-fill);color:var(--s-fg);font-size:15px;font-weight:500;text-decoration:none;box-sizing:border-box}
.capsule svg.i{width:20px;height:20px}
.capsule[aria-pressed="true"],.armed{background:var(--tint)!important;color:var(--tint-ink)!important}
#dlBtn,#hostLink{flex:none}

/* text list */
.tx{display:flex;align-items:center;gap:6px;padding:0 6px 0 0;min-height:52px}
.tx+.tx{box-shadow:inset 0 .5px 0 var(--s-sep)}
.tx-pick{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 8px 8px 14px;min-height:52px;font-weight:400;font-size:17px}
.tx-chk{width:18px;flex:none;color:var(--tint);font-weight:600;text-align:center}
.tx-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--s-dim);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.tx-edit{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--tint)}
.tx-edit svg.i{width:20px;height:20px}

/* per-gap rows */
.gap{display:flex;flex-direction:column;gap:6px;padding:10px 16px;cursor:pointer}
.gap+.gap{box-shadow:inset 0 .5px 0 var(--s-sep)}
.gap-txt{font-size:14px;line-height:1.3;letter-spacing:-.01em;display:grid;gap:1px}
.gap-txt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gap-txt span:first-child{color:var(--s-dim)}
.gap-ctl{display:flex;align-items:center;gap:8px;min-height:34px}
.gap-val{flex:1;font-size:15px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gap.custom .gap-val{color:var(--tint)}
.gap-reset{font-size:14px;font-weight:400;color:var(--tint);min-height:34px;padding:0 6px}

/* pickers */
.tiles{display:grid;gap:8px;flex:none}
#uiGrid{grid-template-columns:repeat(auto-fit,minmax(58px,1fr))}
#skinGrid{grid-template-columns:repeat(5,minmax(0,1fr))}
#guideGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
#fontGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
#skinGrid .tile{font-size:11px;letter-spacing:-.02em}
.tile{display:flex;flex-direction:column;align-items:stretch;gap:5px;font-size:12px;font-weight:400;letter-spacing:-.01em;text-align:center;color:var(--s-fg);min-width:0}
.tile>span:last-child{line-height:1.15;color:var(--s-fg)}
.tile .pv{display:block;border-radius:12px;overflow:hidden;box-shadow:0 0 0 .5px var(--s-sep)}
button.tile[aria-pressed="true"] .pv{box-shadow:0 0 0 2px var(--s-bg),0 0 0 4px var(--tint)}
button.tile[aria-pressed="true"]>span:last-child{font-weight:600}
.tile .ui-pv{background:var(--s-cell);padding:5px;color:var(--s-fg);width:100%;max-width:70px;box-sizing:border-box;margin-inline:auto}
.ui-pv svg{display:block;width:100%;height:auto}
.tile .skin-pv{height:58px;background:var(--bg);color:var(--ink);font:600 19px/1 var(--ui);display:flex;align-items:center;justify-content:center}
.g-pv{position:relative;height:54px;background:var(--bg);--ink:var(--s-fg)}
.g-pv::before{content:"";position:absolute;inset:0;z-index:1;background:repeating-linear-gradient(transparent 0 6px,color-mix(in srgb,var(--ink) 30%,transparent) 6px 9px,transparent 9px 18px)}
.g-pv i{position:absolute;left:0;right:0;top:18px;height:18px;--b:1.500px;--ar:5px;--c:7px;--inset:4px;--r:6px;--stage-l:0px;--lf:color-mix(in srgb,var(--ink) 18%,transparent);--ls:color-mix(in srgb,var(--ink) 60%,transparent)}
.tile .font-pv{height:48px;background:var(--s-cell);display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--s-fg)}

/* editor */
#edit{position:fixed;inset:0;z-index:7;background:var(--s-bg);color:var(--s-fg);display:flex;flex-direction:column;animation:rise .36s var(--spring);user-select:text;-webkit-user-select:text}
.nav{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:50px;padding:calc(4px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 4px max(14px,env(safe-area-inset-left,0px))}
.nav b{font-size:17px;letter-spacing:-.02em;font-weight:600;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .link:first-child{justify-self:start}.nav .link:last-child{justify-self:end}
.edit-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;width:min(100%,720px);margin-inline:auto;box-sizing:border-box;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cell-input{flex:none;min-height:44px;width:100%;box-sizing:border-box;background:var(--s-cell);color:var(--s-fg);border:0;border-radius:10px;padding:0 14px;font:600 17px var(--ui);letter-spacing:-.02em}
#src{flex:1;min-height:0;background:var(--s-cell);color:var(--s-fg);border:0;border-radius:10px;padding:12px 14px;font:400 18px/1.45 var(--ui);letter-spacing:-.015em;resize:none}
#nameIn::placeholder,#src::placeholder{color:var(--s-dim);font-weight:400}
#voiceNote{margin:0;padding:10px 14px;border-radius:10px;background:var(--s-cell);font-size:14px;line-height:1.35;letter-spacing:-.01em}
#editNote,#edStat{margin:0;padding:0 4px;color:var(--s-dim);font-size:13px;line-height:1.35;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#voiceNote:not([hidden])~#editNote{display:none}
#edMore{display:flex;flex-direction:column;gap:6px}
#edMore:not(:has(button:not([hidden]))){display:none}
.danger-row{min-height:44px;border-radius:10px;background:var(--s-cell);color:#FF3B30;font-weight:400;font-size:16px}
#src[readonly]{opacity:.7}

/* reading along with the system dictation */
#kbdBar{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px;align-items:center;padding:5px;border-radius:24px}
#kbdIn{flex:1;min-width:0;height:36px;box-sizing:border-box;resize:none;overflow:hidden;background:var(--glass-fill);color:var(--glass-ink);border:0;border-radius:18px;padding:8px 14px;font:400 16px/20px var(--ui);white-space:nowrap}
#kbdIn::placeholder{color:var(--glass-dim)}
#kbdStop{flex:none;min-height:36px;padding:0 14px;border-radius:18px;background:var(--glass-fill);font-size:15px}

#toast{position:fixed;z-index:8;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));width:max-content;max-width:calc(100% - 32px);padding:12px 18px;border-radius:18px;background:rgba(28,28,30,.94);color:#fff;font-size:15px;font-weight:500;line-height:1.3;letter-spacing:-.02em;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
body.insheet #toast{top:calc(10px + env(safe-area-inset-top,0px))}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<script id="app">
// Texts live in the JSON block above. Saving publishes a new version of the whole page, so people who can edit never need the chat.
const $=id=>document.getElementById(id);
const SRC={css:$('css').textContent,ui:$('ui').innerHTML,app:$('app').textContent};
let SCRIPTS={};try{SCRIPTS=JSON.parse($('texts').textContent)}catch(e){}
$('mount').append($('ui').content.cloneNode(true));
const RESET=':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
function buildDoc(texts){
  const json=JSON.stringify(texts).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
    +'<title>Суфлёр ОЖЛ</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
    +'<style id="css">'+SRC.css+'</style>\n<div id="mount"></div>\n<template id="ui">'+SRC.ui+'</template>\n'
    +'<script type="application/json" id="texts">'+json+'</'+'script>\n<script id="app">'+SRC.app+'</'+'script>\n</body></html>';
}

const root=document.documentElement,stage=$('stage'),text=$('text'),measure=$('measure'),src=$('src'),wpm=$('wpm'),nameIn=$('nameIn');
const P='ozhl-';
const mem={};let spMemo={};
const store={
  get(k){try{const v=localStorage.getItem(P+k);if(v!==null)return v}catch(e){}return k in mem?mem[k]:null},
  set(k,v){mem[k]=String(v);if(k.startsWith('sp-'))spMemo={};try{localStorage.setItem(P+k,v)}catch(e){}},
  del(k){delete mem[k];if(k.startsWith('sp-'))spMemo={};try{localStorage.removeItem(P+k)}catch(e){}}
};
const session={
  get(k){try{return JSON.parse(sessionStorage.getItem(P+k)||'null')}catch(e){return null}},
  set(k,v){try{sessionStorage.setItem(P+k,JSON.stringify(v))}catch(e){}},
  del(k){try{sessionStorage.removeItem(P+k)}catch(e){}}
};
function json(k){try{return JSON.parse(store.get(k)||'null')}catch(e){return null}}
let LOCAL=json('local')||{};
function saveLocal(){store.set('local',JSON.stringify(LOCAL))}

let cur='intro',pos=0,playing=false,last=0,mirror=false,lock=null,fs=52,editing=false,edId=null,edOrig=null,comments=null,art=null,canAll=false;
const posBy={};

// ---- text library: shared texts from the page + this device's own texts and edits
const ids=()=>[...Object.keys(SCRIPTS),...Object.keys(LOCAL).filter(k=>!SCRIPTS[k])];
const exists=id=>!!(SCRIPTS[id]||LOCAL[id]);
function override(id){const s=SCRIPTS[id];if(!s)return null;const o=json('text-'+id);
  return o&&o.v===s.v&&typeof o.text==='string'?o:null}
function textOf(id){return override(id)?.text??(SCRIPTS[id]||LOCAL[id])?.text??''}
function nameOf(id){return override(id)?.name||(SCRIPTS[id]||LOCAL[id])?.name||'Без названия'}
function wordsOf(id){return Math.max(1,textOf(id).trim().split(/\s+/).length)}
function fmt(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function comma(n,d=1){return n.toFixed(d).replace('.',',')}
function autoName(t){const w=t.trim().split(/\s+/).slice(0,3).join(' ');return w.length>28?w.slice(0,28)+'…':w}
function newId(){return 't'+Date.now().toString(36)}

// ---- spacing: line height, gap after a line break, gap after a blank line (both gaps counted in lines)
const DEF={lh:1.35,gl:0,gp:.5};
function num(v,d){return typeof v==='number'&&isFinite(v)?v:d}
function publishedSp(id){const s=SCRIPTS[id]||LOCAL[id]||{};return{lh:num(s.lh,DEF.lh),gl:num(s.gl,DEF.gl),gp:num(s.gp,DEF.gp),gaps:s.gaps||{}}}
function spOf(id){if(spMemo[id])return spMemo[id];const o=json('sp-'+id),b=publishedSp(id);return spMemo[id]=o?{lh:num(o.lh,b.lh),gl:num(o.gl,b.gl),gp:num(o.gp,b.gp),gaps:o.gaps||b.gaps}:b}
const sortedJson=o=>JSON.stringify(Object.keys(o||{}).sort().map(k=>[k,o[k]]));
const eqSp=(a,b)=>a.lh===b.lh&&a.gl===b.gl&&a.gp===b.gp&&sortedJson(a.gaps)===sortedJson(b.gaps);
const norm=w=>w.toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'');
const gapKey=p=>norm(p.lines[0]).slice(0,40);
function gapVal(sp,p){const k=gapKey(p);return typeof sp.gaps[k]==='number'?sp.gaps[k]:sp.gp+p.extra}

function parse(t){const out=[];let blanks=0;
  for(const raw of t.trim().split('\n')){const l=raw.trim();
    if(!l){blanks++;continue}
    if(!out.length||blanks){out.push({extra:Math.max(0,blanks-1),lines:[l]})}else out[out.length-1].lines.push(l);
    blanks=0}
  return out}
// very long words may wrap at a syllable; the type size follows ordinary words
const VOW='аеёиоуыэюяАЕЁИОУЫЭЮЯ';
function softHy(w){let o='',last=0;const V=c=>VOW.includes(c);
  for(let i=0;i<w.length;i++){o+=w[i];const after=w.length-i-1,rest=[...w.slice(i+1)].some(V);
    if(i-last<1||after<3||!rest)continue;
    const n=w[i+1],n2=w[i+2];
    const here=(w[i]==='ь'||w[i]==='ъ')&&!V(n)||(V(w[i])&&!V(n)&&n!==n2&&n2!=='ь'&&V(n2||''));
    const dbl=!V(w[i])&&n===w[i];
    if((here&&i-last>=1)||dbl){o+='­';last=i+1}}
  return o}
const breakLong=l=>l.replace(/[а-яёА-ЯЁ]{13,}/g,softHy);
function fill(el,id,words){const sp=spOf(id);
  el.style.setProperty('--lh',sp.lh);el.style.setProperty('--gl',sp.gl);
  el.replaceChildren(...parse(textOf(id)).map(p=>{const d=document.createElement('div');d.className='para';
    d.style.setProperty('--g',gapVal(sp,p));
    d.append(...p.lines.map(l=>{const n=document.createElement('div');n.className='ln';
      if(!words)n.textContent=breakLong(l);
      else for(const t of breakLong(l).split(/(\s+)/)){const w=norm(t);
        if(!w){n.append(t);continue}
        const s=document.createElement('span');s.className='w';s.textContent=t;n.append(s);words.push({w,el:s})}
      return n}));return d}))}
function gapLines(id){const sp=spOf(id);let g=0;parse(textOf(id)).forEach((p,i)=>{g+=(p.lines.length-1)*sp.gl;if(i)g+=gapVal(sp,p)});return g}

// ---- geometry. Text lines scroll at the chosen tempo; the gaps add real time on top, and that time is the pause.
// Everything the frame loop needs is measured once and cached; a frame only writes one transform.
const M={line:70,top:0,readH:1,textH:1,words:1,startY:0,band:1.5,paras:[],seen:-1};
function linePx(id=cur){return id===cur?M.line:fs*spOf(id).lh}
function measureAll(){const sp=spOf(cur);M.line=fs*sp.lh;M.band=Math.max(1.5,sp.lh);M.top=$('guide').offsetTop;
  M.readH=Math.max(1,text.offsetHeight-M.line);M.textH=Math.max(M.line,M.readH-gapLines(cur)*M.line);M.words=wordsOf(cur);
  M.startY=M.top+fs*(M.band-sp.lh)/2;
  M.paras=[...text.children].map(el=>({el,a:el.offsetTop,b:el.offsetTop+el.offsetHeight}));M.seen=-1;cull()}
function readH(){return M.readH}
function textH(){return M.textH}
function wordTime(id){return wordsOf(id)/(wpm.value/60)}
function speed(){return M.textH/(M.words/(wpm.value/60))}
function bandL(){return M.band}
function lineTop(){return M.top}
function startY(){return M.startY}
function clampPos(v){return Math.min(M.readH,Math.max(0,v))}
// paragraphs far from the screen are not painted
function cull(){const step=Math.floor(pos/400);if(step===M.seen)return;M.seen=step;
  const lo=pos-innerHeight*1.5,hi=pos+innerHeight*2.5;for(const p of M.paras){const far=p.b<lo||p.a>hi;if(far!==p.far){p.far=far;p.el.classList.toggle('far',far)}}}
let lastSec=-1;
function place(){
  text.style.transform=`translate3d(0,${(M.startY-pos).toFixed(1)}px,0)`+(mirror?' scaleX(-1)':'');
  cull();
  const left=Math.round((M.readH-pos)/speed());if(left!==lastSec){lastSec=left;$('time').textContent=fmt(left)}
}
let ratio={};
function stretch(id){if(ratio[id])return ratio[id];
  fill(measure,id);const l=fs*spOf(id).lh,h=Math.max(1,measure.offsetHeight-l),t=Math.max(l,h-gapLines(id)*l);
  measure.replaceChildren();return ratio[id]=h/t}
function totalTime(id){return wordTime(id)*stretch(id)}
function durations(){for(const id of ids()){const el=$('dur-'+id);if(el)el.textContent=fmt(totalTime(id))}}
let scriptWords=[],wordTops=null;
function render(){
  scriptWords=[];wordTops=null;fill(text,cur,scriptWords);fitFont();
  const sp=spOf(cur);root.style.setProperty('--bandL',Math.max(1.5,sp.lh));
  measureAll();
  if(voice.on&&voice.mode==='sr')voiceSync();
  pos=clampPos(pos);place();
}
let fsWant=52;
function fitFont(){let f=fsWant;root.style.setProperty('--fs',f+'px');
  const cs=getComputedStyle(text),col=text.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);let wid=0;
  text.classList.add('fitting');for(const x of scriptWords){if(x.w.length>12)continue;const w=x.el.getBoundingClientRect().width;if(w>wid)wid=w}text.classList.remove('fitting');
  if(wid>col&&col>0){f=Math.max(24,Math.floor(f*col/wid));root.style.setProperty('--fs',f+'px')}
  fs=f;wordTops=null;measureAll()}
function setFs(v){fsWant=Math.min(120,Math.max(26,v));store.set('fs',fsWant);fitFont();ratio={};$('fsV').textContent=fsWant;pos=clampPos(pos);place();durations()}
function paintRange(el){el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min)*100)+'%')}
function setWpm(v){wpm.value=Math.min(+wpm.max,Math.max(+wpm.min,v));$('wpmV').textContent=wpm.value;
  store.set('wpm',wpm.value);lastSec=-1;durations();place();spUI()}

// ---- playback
function tick(t){if(!playing)return;
  if(last)pos+=(voice.on&&voice.live?voiceSpeed(t):speed())*(t-last)/1000;last=t;
  if(voice.on)voiceChipUI(t);
  if(pos>=readH()){pos=readH();toggle(false)}place();requestAnimationFrame(tick)}
let countT=null;
function cancelCount(){if(countT){clearTimeout(countT);countT=null;$('countdown').hidden=true}}
function countThen(fn){let n=3;const el=$('countdown');const step=()=>{if(n===0){el.hidden=true;countT=null;fn();return}el.hidden=false;el.textContent=n--;countT=setTimeout(step,800)};step()}
async function toggle(on=!playing){
  if(on&&editing)return;
  if(countT){cancelCount();return}
  if(on&&!playing&&store.get('count')==='1'&&voice.mode!=='kbd'){countThen(()=>start2());return}
  return start2(on);
}
async function start2(on=true){
  if(on&&pos>=readH()-1)pos=0;
  playing=on;document.body.classList.toggle('playing',on);
  $('play').setAttribute('aria-label',on?'Пауза':'Старт');last=0;
  if(on){expanded=false;document.body.classList.remove('expanded');if(voice.on&&voice.mode==='sr')voiceListen()}else{voiceHush();if(voice.mode==='kbd')kbdStop()}
  chromeUI();
  if(on){requestAnimationFrame(tick);try{lock=await navigator.wakeLock?.request('screen')}catch(e){}}
  else{try{lock&&lock.release()}catch(e){}lock=null}
}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&playing){try{lock=await navigator.wakeLock?.request('screen')}catch(e){}}});

function renderTabs(){$('titleTx').textContent=nameOf(cur);
  $('textList').replaceChildren(...ids().map(id=>{const row=document.createElement('div');row.className='tx';
    const pick=document.createElement('button');pick.className='tx-pick';

    ed.onclick=()=>{if(id!==cur&&!editing)select(id);openEditor(id)};
    row.append(pick,ed);return row}));
  durations()}
function showTab(){}
function showScript(id,p=0){posBy[cur]=pos;cur=id;pos=p;store.set('script',id);
  renderTabs();render();spUI();
  try{if(location.hash!=='#'+id)location.replace('#'+id)}catch(e){}}
function select(id){if(editing||!exists(id)||id===cur)return;toggle(false);showScript(id,posBy[id]||0)}
$('titleBtn').onclick=()=>{toggle(false);renderTabs();openSheet('textsSheet')};
$('textsDone').onclick=()=>closeSheets();
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(exists(h))select(h)});

// ---- saving for everyone: publishes a new version of this page; every open view reloads to it
const READ_ONLY=['not_writer','not_granted','consent_required','not_declared','capability_disabled','capability_removed'];
function clone(){return JSON.parse(JSON.stringify(SCRIPTS))}
function publish(next,resume){toggle(false);session.set('resume',resume);return art.publish(buildDoc(next))}
function publishError(e,onReadOnly){const c=e&&e.code;
  if(c==='conflict'){toast('Текст только что обновили. Страница перезагрузится.');return}
  session.del('draft');session.del('resume');
  if(READ_ONLY.includes(c)){canAll=false;syncEditUI();onReadOnly()}
  else if(c==='rate_limited')toast('Слишком часто. Подождите минуту и сохраните снова.');
  else toast('Не удалось сохранить. Проверьте интернет и попробуйте ещё раз.')}

// ---- editor
function syncEditUI(){
  $('spAll').hidden=!canAll;
  if(!editing)return;
  const shared=edId&&SCRIPTS[edId];
  $('editNote').textContent=canAll?'Сохранится по ссылке для всех, кто её открывает.':'Сохранится только на этом устройстве.';
  $('resetText').hidden=!(shared&&override(edId));
  $('delText').hidden=!edId||ids().length<2||(shared&&!canAll);
  stat();
}
function stat(){const n=src.value.trim()?src.value.trim().split(/\s+/).length:0;
  $('edStat').textContent='Слов: '+n+', '+fmt(n/(wpm.value/60))+' без пауз. Enter начинает новую фразу, пустая строка новый абзац.'}
function setEditor(on){editing=on;$('edit').hidden=!on;document.body.classList.toggle('editing',on)}
function openEditor(id,draft){toggle(false);closeSheets();edId=id;
  nameIn.value=draft?draft.name:(id?nameOf(id):'');src.value=draft?draft.text:(id?textOf(id):'');
  edOrig=draft?{name:'',text:''}:{name:nameIn.value,text:src.value};
  $('editTitle').textContent=id?nameOf(id):'Новый текст';
  voiceReset();disarm();setEditor(true);syncEditUI();
  if(id)src.setSelectionRange(0,0);src.focus()}
function closeEditor(){stopDict();stopTidy();voiceReset();disarm();setEditor(false);edId=null;const b=$('saveEdit');b.disabled=false;b.textContent='Сохранить'}
function dirty(){return nameIn.value!==edOrig.name||src.value!==edOrig.text}
function localSave(id,name,t){
  if(SCRIPTS[id]){if(t===SCRIPTS[id].text.trim()&&name===SCRIPTS[id].name)store.del('text-'+id);
    else store.set('text-'+id,JSON.stringify({v:SCRIPTS[id].v,text:t,name}))}
  else{LOCAL[id]={...(LOCAL[id]||{}),name,text:t};saveLocal()}
  ratio={};closeEditor();renderTabs();showScript(id);durations();
}
$('editBtn').onclick=()=>openEditor(cur);
$('addText').onclick=()=>openEditor(null);
src.addEventListener('input',stat);
$('saveEdit').onclick=async()=>{
  if(tidyCtl){toast('Дождитесь конца оформления или остановите его.');return}
  stopDict();
  const t=src.value.replace(/\r/g,'').trim();
  if(!t){toast('Текст пустой. Вставьте или напишите его.');src.focus();return}
  if(t.includes('[?]')&&armedBtn!==$('saveEdit')){disarm();const b=$('saveEdit');armedBtn=b;armedLabel=b.textContent;b.textContent='Остались [?]. Сохранить?';b.classList.add('armed');armedT=setTimeout(disarm,3500);return}
  disarm();
  const name=nameIn.value.trim()||autoName(t),id=edId||newId(),prev=SCRIPTS[id],sp=spOf(id);
  if(!canAll){localSave(id,name,t);toast('Сохранено на этом устройстве.');return}
  if(prev&&t===prev.text.trim()&&name===prev.name&&eqSp(sp,publishedSp(id))){store.del('text-'+id);ratio={};closeEditor();renderTabs();render();return}
  const next=clone();
  next[id]={name,v:prev?(t===prev.text.trim()?prev.v:(+prev.v||1)+1):1,text:t,...sp};
  const b=$('saveEdit');b.disabled=true;b.textContent='Сохраняю…';
  session.set('draft',{id,name,text:t,isNew:!edId});
  try{await publish(next,{cur:id,pos:0})}
  catch(e){b.disabled=false;b.textContent='Сохранить';
    publishError(e,()=>{localSave(id,name,t);toast('У вас доступ только на просмотр. Текст сохранён на этом устройстве.')})}
};
// two taps for anything that throws work away; the viewer has no confirm()
let armedBtn=null,armedLabel='',armedT;
function disarm(){clearTimeout(armedT);if(armedBtn){armedBtn.textContent=armedLabel;armedBtn.classList.remove('armed')}armedBtn=null}
function twoTap(btn,ask,fn){btn.onclick=()=>{
  if(armedBtn===btn){disarm();fn();return}
  disarm();armedBtn=btn;armedLabel=btn.textContent;btn.textContent=ask;btn.classList.add('armed');
  armedT=setTimeout(disarm,3500)}}
$('cancelEdit').onclick=()=>{
  if(!dirty()||armedBtn===$('cancelEdit')){closeEditor();return}
  disarm();const b=$('cancelEdit');armedBtn=b;armedLabel=b.textContent;b.textContent='Не сохранять?';b.classList.add('armed');
  armedT=setTimeout(disarm,3500)};
twoTap($('resetText'),'Точно вернуть?',()=>{const id=edId;store.del('text-'+id);ratio={};closeEditor();renderTabs();showScript(id)});
twoTap($('delText'),'Точно удалить?',async()=>{
  const id=edId,after=ids().find(x=>x!==id);
  if(SCRIPTS[id]){
    if(!canAll)return;
    const next=clone();delete next[id];
    session.set('draft',{del:id,name:nameOf(id)});
    store.set('script',after);
    try{await publish(next,{cur:after,pos:0})}
    catch(e){store.set('script',id);publishError(e,()=>toast('У вас доступ только на просмотр, общий текст удалить нельзя.'))}
    return}
  const n=nameOf(id);delete LOCAL[id];saveLocal();store.del('sp-'+id);delete ratio[id];closeEditor();
  cur=after;pos=posBy[after]||0;renderTabs();showScript(after,pos);toast('Текст «'+n+'» удалён.')});

// ---- dictation: the browser's own recogniser where the viewer allows it, otherwise the system keyboard's microphone
let rec=null,recWanted=false,recBase='',micBlocked=false;
const MIC_HINT='Claude закрывает странице прямой доступ к микрофону. Курсор уже в поле: на iPhone включите русскую раскладку и нажмите микрофон на клавиатуре. На Mac нажмите клавишу микрофона или выберите «Правка → Начать диктовку».';
function voiceNote(m){const n=$('voiceNote');n.textContent=m||'';n.hidden=!m}
function join(...parts){return parts.filter(Boolean).join(' ').replace(/[ \t]+/g,' ')}
function setDictBtn(on){$('dictLb').textContent=on?'Остановить':'Диктовать';$('dictBtn').setAttribute('aria-pressed',String(on))}
function stopDict(){recWanted=false;setDictBtn(false);if(rec){const r=rec;rec=null;try{r.stop()}catch(e){}}}
function focusEnd(){try{src.focus();const e=src.value.length;src.setSelectionRange(e,e)}catch(e){}}
function micFallback(){stopDict();micBlocked=true;voiceNote(MIC_HINT);focusEnd()}
function startRec(SR){
  const r=new SR();rec=r;r.lang='ru-RU';r.continuous=true;r.interimResults=true;
  recBase=src.value.replace(/\s+$/,'');
  r.onresult=e=>{if(rec!==r)return;let fin='',tmp='';
    for(let i=0;i<e.results.length;i++){const a=e.results[i],t=a[0].transcript;if(a.isFinal)fin=join(fin,t.trim());else tmp=join(tmp,t.trim())}
    src.value=join(recBase,fin,tmp);src.scrollTop=src.scrollHeight;stat()};
  r.onstart=()=>{if(rec===r)voiceNote('Слушаю. Говорите по-русски, потом нажмите «Остановить».')};
  r.onerror=e=>{if(rec!==r)return;
    if(['not-allowed','service-not-allowed','audio-capture','network','language-not-supported'].includes(e.error))micFallback();
    else if(e.error!=='no-speech'&&e.error!=='aborted')voiceNote('Распознавание прервалось. Нажмите «Диктовать» ещё раз.')};
  r.onend=()=>{if(rec!==r)return;
    if(recWanted){try{startRec(SR);return}catch(e){}}
    stopDict();if(!micBlocked)voiceNote('')};
  r.start();
}
$('dictBtn').onclick=()=>{
  if(recWanted){stopDict();voiceNote('');return}
  focusEnd();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||micBlocked){micFallback();return}
  try{recWanted=true;setDictBtn(true);startRec(SR)}catch(e){micFallback()}
};

// ---- "Оформить по смыслу": Claude restores punctuation, paragraphs and misheard words

function tidyPrompt(raw,name){return [

name?'\nНазвание текста: '+name:'',
libraryContext()?'\nМатериалы автора, по которым можно сверять имена и термины (их не переписывай и в ответ не включай):\n<<<МАТЕРИАЛЫ\n'+libraryContext()+'\nМАТЕРИАЛЫ>>>':'',

const SAMPLE_GONE=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
function tidyError(c){
  if(SAMPLE_GONE.includes(c)){sampler=null;syncTidy();return 'Оформление недоступно: для этой страницы не разрешён Claude. Текст остался как был.'}

function micSteps(){const inClaude=!!window.claude;
  const items=!inClaude&&srFailed?['Проверьте, что на устройстве включена Siri: без неё Safari не распознаёт речь.','Разрешите этому сайту микрофон: в Safari нажмите «аА» в адресной строке → «Настройки веб-сайта».','Или нажмите «Начать чтение», и слушать будет диктовка клавиатуры.']
   :inClaude?['Для петлички лучше прямой микрофон: нажмите «Открыть с прямым микрофоном». Откройте ссылку в Safari или Chrome и там нажмите «Голос».','Здесь, в Claude, можно читать через диктовку: нажмите «Начать чтение» и включите диктовку на клавиатуре. На Mac это клавиша микрофона или «Правка → Начать диктовку».']
   :['Нажмите «Начать чтение» и включите диктовку на клавиатуре.','Читайте. Текст пойдёт за вашими словами.'];
  $('micSteps').replaceChildren(...items.map(t=>{const li=document.createElement('li');li.textContent=t;return li}))}
function openMic(){micSteps();const h=$('hostLink');h.hidden=!(HOST&&window.claude);if(!h.hidden)h.href=HOST+'#import='+packLib();openSheet('micSheet')}
const HOST='https://osmonstr.github.io/suflyor/';
function packLib(){const list=ids().map(id=>({id,name:nameOf(id),text:textOf(id).trim(),...spOf(id)}));
  const u=new TextEncoder().encode(JSON.stringify(list));let b='';u.forEach(x=>b+=String.fromCharCode(x));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function importFromHash(){const h=location.hash;if(!h.startsWith('#import='))return;
  try{const b=atob(h.slice(8).replace(/-/g,'+').replace(/_/g,'/'));const u=Uint8Array.from(b,c=>c.charCodeAt(0));
    for(const t of JSON.parse(new TextDecoder().decode(u))){if(!t.id||typeof t.text!=='string')continue;LOCAL[t.id]=t}saveLocal();spMemo={};
    location.replace('#');return true}catch(e){return false}}
function kbdStart(){closeSheets();voice.on=true;voice.mode='kbd';voice.live=true;voice.wps=wpm.value/60;voice.heard=false;
  $('voiceBtn').setAttribute('aria-pressed','true');document.body.classList.add('kbd');$('kbdBar').hidden=false;
  const f=$('kbdIn');f.value='';f.placeholder=kbdPrompt();try{f.focus()}catch(e){}
  afterLayout();voiceReseat();start2(true)}
function kbdStop(){voice.mode='sr';voice.on=false;voice.live=false;$('voiceBtn').setAttribute('aria-pressed','false');document.body.classList.remove('kbd');$('kbdBar').hidden=true;
  try{$('kbdIn').blur()}catch(e){}afterLayout()}
$('kbdIn').addEventListener('input',e=>{const all=[];for(const t of e.target.value.split(/\s+/)){const w=norm(t);if(w)all.push(w)}
  e.target.scrollLeft=e.target.scrollWidth;heardWords(all)});
$('kbdStop').onclick=()=>toggle(false);
$('kbdGo').onclick=kbdStart;
$('voiceBtn').onclick=()=>{
  if(voice.on){voice.on=false;voiceHush();$('voiceBtn').setAttribute('aria-pressed','false');return}
  if(!SRClass()||micPolicyBlocked()){toggle(false);openMic();return}
  voice.on=true;voice.mode='sr';voice.wps=wpm.value/60;$('voiceBtn').setAttribute('aria-pressed','true');
  voiceReseat();if(!isWebKit())voiceListen();else toast('Нажмите старт и начните читать.')};
$('micClose').onclick=closeSheets;
let downloads=null;
(async()=>{try{downloads=await window.claude?.use?.('downloads');$('dlBtn').hidden=!downloads}catch(e){}})();

$('dlBtn').onclick=async()=>{const lib={};
  for(const id of ids())lib[id]={name:nameOf(id),v:1,text:textOf(id).trim(),...spOf(id)};
  try{await downloads.save({filename:'suflyor-ozhl.html',data:buildDoc(lib)})}catch(e){if(e&&e.code!=='cancelled')toast('Не удалось скачать файл.')}};

// ---- controls
function hold(btn,fn){let t,i;const stop=()=>{clearTimeout(t);clearInterval(i)};
  btn.addEventListener('pointerdown',e=>{e.preventDefault();fn();t=setTimeout(()=>{i=setInterval(fn,110)},420)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
  btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}});}
hold($('slower'),()=>setWpm(+wpm.value-5));
hold($('faster'),()=>setWpm(+wpm.value+5));
hold($('fsDown'),()=>setFs(fs-4));
hold($('fsUp'),()=>setFs(fs+4));
$('play').onclick=()=>toggle();
$('restart').onclick=()=>{pos=0;if(voice.on)voiceReseat();place()};
$('mirror').addEventListener('change',e=>{mirror=e.target.checked;place()});

// gestures: tap plays, vertical drag scrolls with momentum, horizontal drag sets tempo, pinch sets size
const pts=new Map();let g=null,momT=0,vel=0,hudT;
function hud(m){const h=$('hud');h.textContent=m;h.hidden=false;clearTimeout(hudT);hudT=setTimeout(()=>{h.hidden=true},900)}
function pinchD(){const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)}
function momentum(t0){let last=t0;const step=t=>{if(momT!==t0||Math.abs(vel)<8||playing)return;const dt=Math.min(40,t-last)/1000;last=t;pos=clampPos(pos+vel*dt);vel*=Math.pow(.05,dt);place();requestAnimationFrame(step)};requestAnimationFrame(step)}
stage.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});momT=0;vel=0;try{stage.setPointerCapture(e.pointerId)}catch(_){}
  if(pts.size===2)g={mode:'pinch',d0:pinchD(),fs0:fsWant};
  else if(pts.size===1)g={mode:'tap',x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t:performance.now(),w0:+wpm.value}});
stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!g)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(g.mode==='pinch'){if(pts.size===2){const f=Math.round(g.fs0*pinchD()/g.d0/2)*2;if(f!==fsWant){setFs(f);hud('Шрифт '+fsWant)}}return}
  const dx=e.clientX-g.x0,dy=e.clientY-g.y0;
  if(g.mode==='tap'&&(Math.abs(dx)>12||Math.abs(dy)>10))g.mode=Math.abs(dx)>Math.abs(dy)*1.4?'tempo':'scroll';
  if(g.mode==='scroll'){const d=g.y-e.clientY,now=performance.now(),dt=Math.max(1,now-g.t);vel=vel*.6+(d/dt*1000)*.4;g.t=now;pos=clampPos(pos+d);if(voice.on){voiceReseat();voice.lastMove=now}place()}
  if(g.mode==='tempo'){const w=Math.round((g.w0+dx/4)/5)*5;if(w!==+wpm.value){setWpm(w);hud(wpm.value+' сл/мин')}}
  g.y=e.clientY});
function endPtr(e,cancel){pts.delete(e.pointerId);if(!g)return;const m=g.mode;
  if(m==='pinch'){if(pts.size===0)g=null;return}
  g=null;if(cancel)return;
  if(m==='tap'){if(document.body.classList.contains('insheet')&&$('pauseSheet').hidden)closeSheets();else toggle()}
  else if(m==='scroll'&&!playing&&Math.abs(vel)>120){const t0=performance.now();momT=t0;momentum(t0)}}
stage.addEventListener('pointerup',e=>endPtr(e,false));
stage.addEventListener('pointercancel',e=>endPtr(e,true));
stage.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setFs(fsWant-Math.sign(e.deltaY)*2);hud('Шрифт '+fsWant);return}pos=clampPos(pos+e.deltaY);place()},{passive:false});
addEventListener('keydown',e=>{const tg=e.target;if(tg.matches?.('input,textarea,button'))return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  if(e.key==='ArrowUp'){e.preventDefault();setWpm(+wpm.value+5)}
  if(e.key==='ArrowDown'){e.preventDefault();setWpm(+wpm.value-5)}});
addEventListener('resize',()=>{root.dataset.ui=uiNow();ratio={};fitFont();chromeUI();pos=clampPos(pos);place();durations();showTab();spUI()});

let toastT;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},4500)}

try{const ro=new ResizeObserver(()=>{root.style.setProperty('--barH',$('bar').offsetHeight+'px')});
  ro.observe($('bar'))}catch(e){}

// ---- "Правка": comment on the paragraph at the reading line
function paraAtLine(){const y=lineTop()+fs*bandL()/2;let best=null,bd=Infinity;
  for(const p of text.children){const r=p.getBoundingClientRect();if(y>=r.top&&y<=r.bottom)return p;
    const d=Math.min(Math.abs(r.top-y),Math.abs(r.bottom-y));if(d<bd){bd=d;best=p}}return best}
(async()=>{try{const c=await window.claude?.use?.('comments');
  if(c&&typeof c.openComposer==='function'){comments=c;$('flag').hidden=false}}catch(e){}})();
$('flag').onclick=async()=>{
  if(!comments)return;toggle(false);
  const p=paraAtLine();if(!p)return;
  p.classList.add('flagged');setTimeout(()=>p.classList.remove('flagged'),2500);
  try{const r=document.createRange();r.selectNodeContents(p);await comments.openComposer({range:r})}
  catch(e){const c=e&&e.code;
    if(c==='rate_limited')toast('Слишком часто. Попробуйте через минуту.');
    else{$('flag').hidden=true;toast('Комментарии здесь недоступны.')}}
};

// ---- who may save for everyone
(async()=>{try{const a=await window.claude?.use?.('artifact');
  if(!a||typeof a.publish!=='function')return;art=a;
  let ok=true;
  try{const u=await window.claude?.use?.('user');if(u&&typeof u.canEdit==='function')ok=(await u.canEdit())!==false}catch(e){}
  canAll=ok;syncEditUI();spUI()}catch(e){}})();

// ---- after a reload: drop local copies the page now holds, keep the ones it does not
function reconcile(){const gone=[];
  for(const id in SCRIPTS){const s=SCRIPTS[id];
    if(LOCAL[id]){delete LOCAL[id];saveLocal()}
    const o=json('text-'+id);
    if(o){if(typeof o.text==='string'&&o.text.trim()===s.text.trim()&&(!o.name||o.name===s.name))store.del('text-'+id);
      else if(o.v!==s.v){store.del('text-'+id);gone.push(s.name)}}
    const sp=json('sp-'+id);if(sp&&eqSp(spOf(id),publishedSp(id)))store.del('sp-'+id)}
  if(gone.length)toast('Обновлён текст «'+gone.join('», «')+'». Правки, сделанные на этом устройстве, сброшены.')}

// ---- boot (keeps the chosen text and position when the page updates live)
function start(d){d=d||{};
  importFromHash();
  if(!window.claude&&SCRIPTS.demo&&Object.keys(LOCAL).length)delete SCRIPTS.demo;
  const draft=session.get('draft'),resume=session.get('resume');session.del('draft');session.del('resume');
  const keepDraft=draft&&!draft.del&&(!SCRIPTS[draft.id]||SCRIPTS[draft.id].text.trim()!==String(draft.text).trim()||SCRIPTS[draft.id].name!==draft.name);
  reconcile();
  const h=location.hash.slice(1),saved=store.get('script');
  let s=(resume&&exists(resume.cur))?resume.cur:(d.cur&&exists(d.cur))?d.cur:exists(h)?h:(saved&&exists(saved))?saved:ids()[0];
  if(d.posBy)for(const k in d.posBy)if(typeof d.posBy[k]==='number')posBy[k]=d.posBy[k];
  if(resume&&typeof resume.pos==='number')posBy[s]=resume.pos;
  const w=+store.get('wpm');if(w)wpm.value=w;
  const f=+store.get('fs');fsWant=f||(innerWidth<500?52:innerWidth<1000?72:84);
  buildPickers();
  look={ui:store.get('ui')||'classic',skin:store.get('skin')||'night',guide:store.get('guide')||'pill',font:store.get('font')||''};
  if(!UIS.some(u=>u[0]===look.ui))look.ui='classic';
  if(!SKINS.some(u=>u[0]===look.skin))look.skin='night';
  if(!GUIDES.some(u=>u[0]===look.guide))look.guide='pill';
  if(!FONTS_R.some(u=>u[0]===look.font))look.font='';
  root.dataset.ui=uiNow();root.dataset.skin=look.skin;root.dataset.guide=look.guide;$('guide').dataset.g=look.guide;applyFont();
  $('countOn').checked=store.get('count')==='1';
  cur=s;pos=posBy[s]||0;
  root.style.setProperty('--fs',fsWant+'px');
  root.dataset.ui=uiNow();measureAll();renderTabs();render();setFs(fsWant);setWpm(+wpm.value);applyLook();
  if(!store.get('tips')&&!draft)openSheet('tipsSheet');
  if(draft){
    if(draft.del)toast(SCRIPTS[draft.del]?'Текст не удалился: его только что меняли. Попробуйте ещё раз.':'Текст «'+draft.name+'» удалён.');
    else if(keepDraft){openEditor(draft.isNew?null:(exists(draft.id)?draft.id:null),draft);toast('Пока вы правили, страницу обновили. Ваш вариант в редакторе: проверьте и сохраните ещё раз.')}
    else toast('Сохранено. Текст виден всем по ссылке.')}
  else if(resume&&resume.sp)toast(SCRIPTS[s]&&eqSp(publishedSp(s),resume.sp)?'Интервалы сохранены на всех устройствах.':'Интервалы не сохранились: страницу только что обновили. Нажмите «Сохранить везде» ещё раз.');
  document.fonts?.ready.then(()=>{ratio={};fitFont();pos=clampPos(pos);place();durations();spUI()});
}
try{window.claude?.hot?.snapshot?.(()=>({cur,posBy:{...posBy,[cur]:pos}}))}catch(e){}
const hot=window.claude?.hot;
hot?.ready?hot.ready(start):start(hot?.data??{});
</script>
